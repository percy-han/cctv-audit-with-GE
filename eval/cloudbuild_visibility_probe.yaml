# Cloud Build pipeline for running the Oracle Visibility / Perception Probe ("能不能看见" 测试)
# entirely on GCP as the stack's worker service account. Nothing in this file names a project,
# region, bucket, Sheet or user; every stack passes its own. Usage (P=project, R=region):
#   WORKER_SA=<main.tf output worker_service_account_email>
#   BUCKET=<main.tf output staging_bucket_name>
#   IMG=$(gcloud run services describe <name_prefix>-worker --region=$R \
#     --project=$P --format='value(spec.template.spec.containers[0].image)')
#   gcloud builds submit --project=$P --region=$R \
#     --config=eval/cloudbuild_visibility_probe.yaml \
#     --service-account=projects/$P/serviceAccounts/$WORKER_SA \
#     --gcs-log-dir=gs://$BUCKET/eval/cloudbuild-logs \
#     --gcs-source-staging-dir=gs://$BUCKET/eval/source \
#     --substitutions=_PROBE_RUN_ID=vprobe_01,_IMAGE=$IMG,_WORKER_SA=$WORKER_SA,_STAGING_BUCKET=$BUCKET,\
#   _MASTER_PROMPT_SHEET_ID=<sheet id>,_WORKSPACE_IMPERSONATE_USER=<bot user> --async .
# The step refuses to run unless it really runs as _WORKER_SA.

substitutions:
  _PROBE_RUN_ID: 'vprobe_01'
  _CONCURRENCY: '4'
  _GEMINI_TIMEOUT_MS: '600000'
  _IMAGE: ''
  _WORKER_SA: ''                  # <name_prefix>-worker@<project>.iam.gserviceaccount.com
  _STAGING_BUCKET: ''             # main.tf output staging_bucket_name
  _MASTER_PROMPT_SHEET_ID: ''     # <env>.tfvars master_prompt_sheet_id
  _WORKSPACE_IMPERSONATE_USER: '' # <env>.tfvars workspace_impersonate_user ('' = the SA itself)

options:
  machineType: 'E2_HIGHCPU_8'

timeout: '5400s'

steps:
  - name: '${_IMAGE}'
    id: 'run-visibility-probe'
    entrypoint: 'bash'
    env:
      - 'GCP_PROJECT=${PROJECT_ID}'
      - 'GOOGLE_CLOUD_PROJECT=${PROJECT_ID}'
      - 'VERTEX_LOCATION=global'
      - 'VIDEO_MEDIA_PROCESSING=agentic'
      - 'STAGING_BUCKET=${_STAGING_BUCKET}'
      - 'GCS_STAGING_BUCKET=${_STAGING_BUCKET}'
      - 'GEMINI_TIMEOUT_MS=${_GEMINI_TIMEOUT_MS}'
      - 'MASTER_PROMPT_SHEET_ID=${_MASTER_PROMPT_SHEET_ID}'
      - 'SOP_SHEET_ID=${_MASTER_PROMPT_SHEET_ID}'
      - 'WORKSPACE_IMPERSONATE_USER=${_WORKSPACE_IMPERSONATE_USER}'
      - 'WORKSPACE_DWD_SERVICE_ACCOUNT=${_WORKER_SA}'
      - 'PYTHONPATH=/workspace'
    args:
      - '-ce'
      - |
        for v in _IMAGE="${_IMAGE}" _WORKER_SA="${_WORKER_SA}" _STAGING_BUCKET="${_STAGING_BUCKET}" \
                 _MASTER_PROMPT_SHEET_ID="${_MASTER_PROMPT_SHEET_ID}"; do
          [[ -n "$${v#*=}" ]] || { echo "substitution $${v%%=*} is required (see header)" >&2; exit 1; }
        done
        python3 /workspace/deploy/ci_pipeline.py check-identity --expected "${_WORKER_SA}"
        pip install -q "google-cloud-aiplatform[evaluation]==2.2.0" "google-cloud-storage==3.15.0"
        python3 -c "import agentplatform, google.cloud.storage"
        python3 /workspace/eval/run_visibility_probe.py \
          --probe-run-id "${_PROBE_RUN_ID}" \
          --concurrency "${_CONCURRENCY}"
