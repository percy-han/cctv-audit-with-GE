# CHAGEE (霸王茶姬) 门店 CCTV 远程稽核规则 —— chagee-store-v2
# 依据《APAC Cloud Audit Parameters 2026 v1.0》
#
# 这份文件是稽核标准的唯一来源，改规则不需要改代码。
# 发布：.venv/bin/python deploy/sop/publish.py put chagee-store-v2 <本文件>
#
# 字段说明：
#   id                  规则编号，会写进每条记录，用于统计与追溯
#   name                中文规则名
#   description         判定标准正文，会原样进入 prompt
#   severity            命中违规时的严重度：RED_LINE | NORMAL
#                       严重度是**规则的属性**，不是模型每条现场决定的——所以一条规则
#                       里不能既有红线项又有一般项。参数表里 C4/C5/C7 三段是混的，
#                       在这里按严重度拆成了 A/B 两条（C4A/C4B、C5A/C5B、C7A/C7B），
#                       否则戴个耳环会和"操作区玩手机"一起算成致命缺陷。
#   detection_type      presence  = 看到某个动作/状态即违规（举证容易）
#                       absence   = 该做而没看到做才算违规（举证困难）
#   positive_indicators 合规的视觉特征
#   negative_indicators 违规的视觉特征
#   requires_full_context
#                       true 表示该条依赖一串动作或一段时长。片段没覆盖全时，
#                       按原则二判 UNVERIFIED 并说明链条断在哪，**仍然上报**。
#                       （v1 里这个字段的含义是"判 CANNOT_DETERMINE"，
#                        也就是从违规表里消失——2026 标准把这一条反过来了。）
#
# ⚠️ 与窗口长度有关的一条硬事实，看这份文件的人必须知道：
#   每次调用只看一个 WINDOW_SECONDS 长的片段，**没有上文也没有下文**。
#   所以凡是阈值超过窗口长度的判定（垃圾溢满 15 分钟、冷藏物料常温 15 分钟、
#   A1 的 5 分钟监视窗），在单个片段里**不可能测准**。这些条目的 description 里
#   都写明了：看到征兆就报 SUSPECTED / UNVERIFIED 并注明需跨片段核对，
#   不要在片段内自行推断时长是否达标。
#
# 本版相对 v1 的范围变化（客户 2026-09-17 拍板）：
#   砍掉 —— B 制冰机周清洁、D 运营与人效(IPLH/出杯计数)、A5 2 小时周期洗手、
#           步骤 0 时间轴校准（网页版监控没有烧录时间戳，时间由分片机制换算）
#   不按周切换主模块，A 段和 C 段每次都全部检查

version: 2

# 判定之前必须先写下来的观察。v1 没有这一节，所以「视觉证据锚定」这一步在
# 生产上一直是关掉的；v2 第一次打开它。
# 顺序有意义：模型按 schema 自上而下填，人和手先写下来，后面的判定才有东西可回溯。
visual_scan:
  - subject: 人员
    question: >-
      画面中一共出现过几个人？逐个描述性别、发型、有没有戴帽/发网/口罩、围裙颜色、
      所处工位。必须扫到画面边缘、背景纵深、镜面反射和门口进出的人，
      只出现几秒的也要写出来。

  - subject: 手部与手套
    question: >-
      每个人的手是裸手还是戴手套？手套什么颜色、有没有破损或明显污渍？
      此刻手上拿着什么东西？看不清手部就明确写"手部被遮挡/看不清"。

  - subject: 头面部与配饰
    question: >-
      帽子/发网有没有戴正、有没有头发露在外面？口罩有没有遮住口鼻，有没有滑到
      鼻下或下巴？有没有耳环、耳钉、手表、戒指、手链、项链、假指甲、装饰发夹？

  - subject: 着装
    question: >-
      是不是统一工装？围裙和制服上有没有污渍、线头、粘着的头发或有效期标签？
      裤子是不是亮色或短裤？鞋子有没有露趾？

  - subject: 手接触过的物体
    question: >-
      按时间顺序列出每个人的手先后接触过哪些东西（垃圾桶或垃圾抽屉含把手、地面、
      手机、现金或 POS、面部、头发、清洁工具、杯具、冰铲、食材……）。
      这一项是 A1/A2 的判定依据，漏了就没法判洗手。

  - subject: 水槽与洗手
    question: >-
      画面里有没有实体洗手水槽？有没有人站在水槽处？有没有可见的流水？
      有没有取用洗手液和擦手纸的动作？完全没拍到水槽就明确写"水槽不在画面内"。

  - subject: 杯具与器具
    question: >-
      出现了哪些客用杯、雪克杯、量杯、吧勺、冰铲、泡茶壶、滤网？它们分别放在哪？
      杯身上有没有贴着标签，有几层？冰铲是放在收纳盒里还是插在冰仓里？

  - subject: 垃圾与地面
    question: >-
      垃圾桶有没有盖子、盖着没有、是不是脚踏式、有没有套袋？垃圾有没有高出桶口？
      地面有没有积水、垃圾或洒落的物料？

  - subject: 台面、毛巾与个人物品
    question: >-
      操作台面整洁吗，有没有积水、茶渣、糖浆？画面里的毛巾是红边、蓝边还是绿边，
      分别放在哪（台面上／独立容器里／悬挂）？有没有手机、个人食品饮料、
      私人物品出现在操作区？

  - subject: 顾客与服务
    question: >-
      有没有顾客出现在画面里？在什么位置、停留了多久？有没有员工主动招呼？
      有交接动作的话，是单手还是双手？没有顾客就写"本片段无顾客出现"。

rules:
  # ───────────────────────── 【A】洗手与手部卫生 ─────────────────────────

  - id: A1_HANDWASH_TRIGGER
    name: 污染后未见洗手
    severity: NORMAL
    detection_type: absence
    requires_full_context: true
    description: >-
      出现下列任一"强制洗手触发事件"后，该员工必须完成完整洗手才能恢复作业。
      高危污染类：打喷嚏、咳嗽掩口、挖鼻、大面积擦拭面部；处理垃圾袋、碰触垃圾桶或
      垃圾抽屉（含把手）、给垃圾桶套袋；从地面拾取物品或触碰地面；使用刮水板、拖把、
      清洗隔油池等清洁工具；踩踏操作台面。
      常规触发类：上岗或当班开始；休息后返岗；如厕后；接触现金或 POS 收银后；
      完成任何清洁作业后；手套破损或被污染后。
      判定方式：看到触发事件后，在本片段剩余时间内追踪该员工。
      本片段内看到了完整洗手 → COMPLIANT；
      看到触发但**没看到**完整洗手 → UNVERIFIED，evidence 写明"触发事件是什么、
      之后这个人去了哪里"；
      该员工触发后走出画面 → UNVERIFIED，注明"污染后去向不明"；
      片段在追踪过程中结束 → UNVERIFIED，注明"监视窗被截断"。
      三种情况**都要上报**，不许因为没追踪完而判 COMPLIANT。
      注意：本片段通常只有一分钟左右，远短于参数表要求的 5 分钟监视窗，
      所以"监视窗被截断"是常态而不是异常，不要为了凑一个结论而推断片段之外的事。
    positive_indicators:
      - 触发事件后径直走向水槽并完成洗手
      - 触发事件后摘除旧手套、洗手、换上新手套
    negative_indicators:
      - 碰过垃圾桶把手后直接回到操作台
      - 从地面捡起东西后没洗手就继续作业
      - 收完现金后直接拿取杯具
      - 擦过脸或摸过头发后没洗手

  - id: A2_HANDWASH_REDLINE
    name: 污染后未洗手即接触食品接触工具（红线）
    severity: RED_LINE
    detection_type: absence
    requires_full_context: true
    description: >-
      本片段内**同时**看到下面三件事，即为红线违规：
      (1) 发生了 A1 所列的强制洗手触发事件；
      (2) 之后**没有**观察到完整洗手流程；
      (3) 该员工**直接戴上手套**，或恢复接触食品接触工具／出餐。
      食品接触工具清单：泡茶壶 (tea brewer pot)、滤网 (tea filter net)、
      茶基容器 (tea base container)、雪克杯 (shaker cup)、冰铲 (ice scoop)、
      CHAGEE 纸杯、吸管、量杯、吧勺、滤器。
      "污染后直接戴手套"本身就是独立违规（参数表 1.5.3），即使后续没碰食品也要报。
      三要素缺任意一环没看到 → 不判 CONFIRMED，改判 UNVERIFIED 并说明缺的是哪一环，
      **仍然上报**，不要判 COMPLIANT。
      三要素之间必须是**同一个人**，用 people 里的人员 ID 在 evidence 里写清楚是谁。
    positive_indicators:
      - 触发事件与接触食品之间存在完整洗手
      - 触发后更换了新手套且洗了手
    negative_indicators:
      - 处理完垃圾袋直接抓取冰铲或雪克杯
      - 碰过地面后不洗手直接戴上手套
      - 收银后未洗手就去拿客用杯

  - id: A3_HANDWASH_STEPS
    name: 洗手动作五步核对
    severity: NORMAL
    detection_type: absence
    requires_full_context: true
    description: >-
      本片段内只要出现洗手动作，就逐项核对五个步骤并在 evidence 里写出核对结果：
      (1) 湿手——先用流水冲淋双手；(2) 取洗手液——有按压或取用动作；
      (3) 搓洗 ≥20 秒——必须写出你数到的实际秒数；(4) 清水冲洗——冲掉泡沫；
      (5) 纸巾擦干——取用擦手纸架上的纸巾。
      洗手必须在**实体水槽 + 可见流水**处完成；用毛巾擦手不等于洗手；
      在洗手池里洗手套也不等于洗手。
      缺任意一步 → 违规（非红线，但必报）。顺序错误（例如先打洗手液再湿手）→ 违规。
      按原则四，搓手时长在 19–21 秒之间读不准时，一律判"不足 20 秒"。
      本片段内**完全没有出现洗手动作**时，本条填 OUT_OF_SCOPE（该动作不在画面内），
      "有没有该洗而没洗"由 A1／A2 负责，不要在这里重复报。
    positive_indicators:
      - 流水湿手 → 取液 → 搓洗超过 20 秒 → 冲洗 → 纸巾擦干，顺序完整
    negative_indicators:
      - 只冲了三五秒水就甩手走开
      - 先打洗手液再去开水龙头
      - 打完洗手液直接用围裙或抹布擦干
      - 用毛巾擦一下手代替洗手

  - id: A4_GLOVE
    name: 手套规范
    severity: RED_LINE
    detection_type: absence
    requires_full_context: true
    description: >-
      处理食品必须戴手套。洗手后必须**立即更换新手套**——洗完手继续戴回旧手套即为违规。
      手套破损或被污染（碰过垃圾、地面、面部、现金）后必须立即更换。
      手套的穿戴状态在**本片段内**可以延续：一旦看到某人戴着手套，在本片段内没看到
      明确的脱除动作之前，默认仍然戴着。**跨片段不适用**——你看不到上一段。
      看不清是裸手还是戴了手套（手部被遮挡、画面太小、肤色与手套同色）→ SUSPECTED，
      在 evidence 里描述你看到的像素级现象，**仍然上报**。
    positive_indicators:
      - 接触食品前戴上完整无破损的食品级手套
      - 洗手后取用新手套
    negative_indicators:
      - 裸手接触食材、冰块或杯口内侧
      - 洗完手把原来那副手套重新戴上
      - 手套破口、沾有明显污渍仍继续使用
      - 戴着处理过垃圾的同一副手套继续制作饮品

  # ───────────────────── 【C】常态红线扫描（每次都跑） ─────────────────────

  - id: C1_CROSS_CONTAM
    name: 交叉污染（'0' Tolerance）
    severity: RED_LINE
    detection_type: presence
    requires_full_context: false
    description: >-
      下列任一行为出现即为红线违规：
      工具或餐具掉地后未彻底清洗消毒即复用；员工踩踏操作台面后未消毒即恢复作业；
      在食品水槽内清洗拖把、刮水板或隔油池；用食品包装材料盛装化学品；
      多余食材倒回原包装；手指碰触客用杯内壁；徒手抓取即食半成品（冰块、切片水果）；
      掉在操作台上的即食食品未丢弃仍继续使用；掉地或掉进污水区的食材包装未消毒即复用；
      自动化设备软管直接放入物料盒。
      "高危行为后未洗手"不在本条，由 A1／A2 负责，不要重复报。
      看到疑似动作但被遮挡或分辨率不足 → SUSPECTED，**仍然上报**。
    positive_indicators:
      - 掉地的器具被送去清洗消毒后才回到台面
      - 只用冰铲取冰，手不进冰仓
    negative_indicators:
      - 徒手抓冰或抓取切好的水果
      - 手指伸进客用杯口内侧拿杯
      - 在食品水槽里涮拖把
      - 掉在台面上的珍珠又被舀回杯里

  - id: C2_CUP_MISUSE
    name: 杯具使用（'0' Tolerance）
    severity: RED_LINE
    detection_type: presence
    requires_full_context: false
    description: >-
      下列任一行为出现即为红线违规：重复使用饮品杯；顾客未取或已取消的饮品没有丢弃、
      杯子被复用；杯身贴了多重标签（没撕掉旧标签就复用）；
      把收银小票、笔、文具放进饮品杯或食品容器。
      判定重点在**杯身标签层数**和**杯子的去向**：看到一个杯子上贴着两层以上标签，
      即使没看到复用动作，也按 SUSPECTED 上报。
    positive_indicators:
      - 取消的饮品连杯带内容物一起丢弃
      - 每个杯子只有一张当次订单标签
    negative_indicators:
      - 杯身叠着两层或以上的订单标签
      - 把顾客没取走的饮品倒掉后杯子留着继续用
      - 笔或小票插在杯子里

  - id: C3_MISCONDUCT
    name: 不当行为（'0' Tolerance）
    severity: RED_LINE
    detection_type: presence
    requires_full_context: false
    description: >-
      下列任一行为出现即为红线违规：店内吸烟或使用电子烟；玩扑克牌；营业时间内睡觉；
      在备餐时或顾客面前进食、饮水；拍摄视频（在顾客面前拍摄，或拍摄非工作内容）；
      对顾客表现敌意、讽刺、轻慢；无视在场顾客或顾客的需求。
      手到口部的动作按第二步 2.4 处置：明确看到烟／电子烟／食物 → CONFIRMED；
      在后门、走廊、仓库口这类闲置区看到重复的手→口往返，或在生产区看到手→口往返
      但被遮挡 → SUSPECTED，**必须上报**。
    positive_indicators:
      - 全程专注于制作与接待
    negative_indicators:
      - 手持点燃物送到嘴边并有吐雾动作
      - 背对顾客往嘴里送东西并咀嚼
      - 趴在台面或靠墙闭眼不动
      - 举着手机对准操作区或顾客

  - id: C4A_GROOMING
    name: 仪容与着装
    severity: NORMAL
    detection_type: presence
    requires_full_context: false
    description: >-
      配饰一律禁止：耳环、耳钉、手表、戒指、手链、项链、假指甲、装饰发夹。
      着装要求：制服 + 发网 + 帽子 + 口罩齐全；制服和围裙洁净无污渍；
      制服上不得有线头、头发、有效期标签；发网外不得露出散发；
      不得穿亮色裤或短裤、不得穿露趾鞋。
      口罩滑落到鼻下或下巴、帽子外露头发，都算本条违规。
      ⚠️ 手套不属于本条，由 A4_GLOVE 判定。本条的 evidence 里一个字都不要提手套，
      也不要因为没戴手套而判本条违规——那会让同一件事在报告里出现两次。
      ⚠️ 本条清单里一部分看得见、另一部分看不见时（例如手部拍得到但头面部在画面外），
      按**看得见的那部分**给 disposition，看不见的部分只在 evidence 末尾附一句说明，
      不要把「已确认的违规」和「没拍到」揉进同一条结论里——那会让处置标签
      和它自己的 evidence 互相矛盾。若看得见的部分全部合规、只有看不见的部分存疑，
      判 SUSPECTED 而不是 CONFIRMED。
      画面太小看不清有没有戴戒指、耳钉这类小件 → 不要判 COMPLIANT，
      填 SUSPECTED 并写明"分辨率不足以确认手部／耳部配饰"。
    positive_indicators:
      - 口罩完整覆盖口鼻，鼻夹贴合
      - 帽子和发网戴正，无碎发外露
      - 手腕、手指、耳部无任何饰物
    negative_indicators:
      - 口罩下滑露出鼻孔或挂在下巴
      - 额前或耳后有明显散落头发
      - 手上戴着戒指、手表或手链
      - 围裙有明显污渍，或粘着线头、头发

  - id: C4B_ONDUTY
    name: 在岗行为红线
    severity: RED_LINE
    detection_type: presence
    requires_full_context: false
    description: >-
      下列任一行为出现即为红线违规：在顾客面吧台或厨房使用手机处理非工作事务；
      等客时倚靠台面 (Leaning on the counter)；个人物品没有放在指定区域；
      个人食品饮料出现在生产区。
      注意区分：使用门店点单平板或收银终端属于正常工作，不是违规。
      判断依据是**设备形态和握持方式**——个人手机通常单手竖持、屏幕朝向本人、
      有滑动动作；门店平板多为固定支架或双手横持面向顾客。
      两者分不清时 → SUSPECTED，**仍然上报**，在 evidence 里写明你看到的设备外形。
    positive_indicators:
      - 站姿直立，双手在操作区内
      - 手持设备为固定在支架上的点单平板
    negative_indicators:
      - 单手竖持发亮的小屏设备并低头滑动
      - 上半身重量压在台面边缘，手肘支撑
      - 私人水杯、背包、外套出现在操作台上

  - id: C5A_WASTE
    name: 垃圾容器规范
    severity: NORMAL
    detection_type: presence
    requires_full_context: false
    description: >-
      垃圾桶盖用后必须盖回；桶盖不得缺失或损坏；必须使用脚踏式垃圾桶且踏板有效；
      必须套垃圾袋；不得用水槽、纸箱或无标签食品容器当垃圾容器；
      临时垃圾袋必须扎口。
      这些都是**状态类**判定，看一眼画面就能给结论，不需要看完整过程。
    positive_indicators:
      - 垃圾桶带盖且处于闭合状态
      - 桶内套着垃圾袋，袋口整齐
      - 脚踏踩下后桶盖开启
    negative_indicators:
      - 垃圾桶敞着口没有盖子
      - 用纸箱或塑料筐盛装垃圾
      - 装满的垃圾袋放在地上没有扎口

  - id: C5B_OVERFLOW
    name: 垃圾溢满与地面清洁（红线）
    severity: RED_LINE
    detection_type: presence
    requires_full_context: true
    description: >-
      垃圾溢满超过 15 分钟；或备餐区、吧台地面积水、有垃圾超过 15 分钟未清理。
      ⚠️ 本片段通常只有一分钟左右，**不可能在片段内测出 15 分钟**。所以：
      看到垃圾高出桶口，或看到地面明显积水／垃圾 → 一律判 SUSPECTED，
      在 evidence 里写明"本片段内该状态持续存在，片段长度不足以判定是否超过 15 分钟，
      需跨片段核对"。
      **不要**因为测不出 15 分钟而判 COMPLIANT——那是原则一禁止的漏报；
      也**不要**自行推断它已经持续了 15 分钟——那是原则五禁止的编造。
      画面里垃圾桶不满、地面干净 → COMPLIANT。垃圾桶和地面都不在画面内 → OUT_OF_SCOPE。
    positive_indicators:
      - 垃圾未高出桶口，地面干燥无杂物
    negative_indicators:
      - 垃圾堆出桶口或袋子鼓起顶开桶盖
      - 地面有成片积水、洒落的茶汤或散落包装

  - id: C6_EQUIPMENT
    name: 设备与器具
    severity: NORMAL
    detection_type: presence
    requires_full_context: false
    description: >-
      自动泡茶机：茶桶底部不得有可见余水；茶网必须沥干；热水口与卡扣在冲泡前后都要擦拭；
      冲泡流程须符合 SOP。
      冷藏门：安装规范、不得错轨、用后随手关闭、不得有缝隙漏冷。
      搅拌机存放时不得密封。蒸汽机：蒸汽棒使用前后都要放气，用后擦净无堵塞。
      混合机 (Mixer)：搅拌杆使用前后都要清洁。
      茶具（茶桶、茶网、吧勺、滤器）冲泡前须洁净；茶桶与滤袋须拆开分别清洗。
      开封的茶叶袋须挤出空气并密封。未使用电子秤称量食材。
      未做温度计晨间校准、手冲未测温、泡茶机温度水量未核对或造假。
      "冷藏物料在常温放置超过 15 分钟"同样测不进一个片段，按 C5B 的写法处理：
      看到物料放在常温台面上就记 SUSPECTED 并注明需跨片段核对时长。
      本片段内相关设备完全不在画面里 → OUT_OF_SCOPE，不要凭常识给结论。
    positive_indicators:
      - 冲泡前后擦拭热水口与卡扣
      - 冷藏门随手关严，无缝隙
      - 称量食材时使用电子秤
    negative_indicators:
      - 茶桶底部有明显积水
      - 冷藏门虚掩或卡在轨道上
      - 茶网湿淋淋地直接放回
      - 直接用手抓取或目测分量，不上秤

  - id: C7A_SERVICE
    name: 出品与交付服务
    severity: NORMAL
    detection_type: absence
    requires_full_context: true
    description: >-
      付款后必须**双手**递交小票或找零；必须引导顾客至等候区或座位区；
      取餐时必须核对小票或手机订单；出品必须密封加盖、杯身方向端正、
      配齐吸管／纸巾／汤匙。
      本片段内没有任何顾客交接动作 → OUT_OF_SCOPE（不在画面内），不要判 COMPLIANT。
      有交接动作但看不清是单手还是双手 → SUSPECTED，仍然上报。
    positive_indicators:
      - 双手递出小票或找零，身体前倾
      - 出杯前核对了杯身标签与订单
      - 杯口封膜完整，吸管纸巾一并递出
    negative_indicators:
      - 单手把找零推过台面
      - 没有核对直接把杯子放到取餐台
      - 出品没有封盖或没配吸管

  - id: C7B_GREETING
    name: 顾客招呼超时（红线）
    severity: RED_LINE
    detection_type: absence
    requires_full_context: true
    description: >-
      顾客在服务区域内停留超过 10 秒仍未获得主动招呼，即为红线违规。
      判定方式：从顾客进入画面的那一帧开始计秒，到员工出现明确的招呼动作
      （转身面向顾客、点头、开口说话的口型、挥手示意）为止。
      10 秒这个阈值**在本片段内可以测**——片段通常有一分钟左右，比阈值长。
      按原则四，9–11 秒之间读不准时一律判"超过 10 秒"。
      顾客进入画面时片段已接近结束，不足以观察满 10 秒 → UNVERIFIED，
      注明"片段剩余时长不足以判定招呼是否超时"，**仍然上报**。
      本片段内完全没有顾客出现 → OUT_OF_SCOPE。
    positive_indicators:
      - 顾客靠近后员工在数秒内转身面向顾客并开口
    negative_indicators:
      - 顾客站在点单台前，员工背对操作且全程没有转身
      - 顾客在取餐口等待，多名员工经过但无人示意
